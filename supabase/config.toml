# Supabase CLI config. Only the settings this project depends on are listed; the CLI
# fills in defaults for everything else. Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "care-companion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
enabled = true
site_url = "carecompanion://"
additional_redirect_urls = ["carecompanion://", "carecaregiver://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# The Companion (patient) app signs in anonymously so the patient never types a password.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

# On deploy the CLI only auto-detects a deno.json sitting next to a function's index.ts,
# so every function points at the shared map explicitly. Paths are relative to this file.

[functions.livekit-token]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.notify-request]
# Called by the voice agent with the service role key; JWT check is done in code.
verify_jwt = false
import_map = "./functions/deno.json"

[functions.generate-daily-summary]
# Called by pg_cron with the service role key; JWT check is done in code.
verify_jwt = false
import_map = "./functions/deno.json"
